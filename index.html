<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Langley Ops</title><style>:root{--g:#58e99a;--m:#8f9a95;--l:rgba(89,242,151,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 0,rgba(30,118,76,.16),transparent 32%),#000;color:#f5f7f6;font-family:Inter,Arial,sans-serif}.shell{max-width:1400px;margin:auto;padding:44px 54px}.top{display:flex;justify-content:space-between;align-items:center}.id{display:flex;align-items:center;gap:16px}.logo{width:54px;height:54px;object-fit:contain}.avatar{width:50px;height:50px;border-radius:12px;object-fit:cover;border:1px solid #58e99a}.x{font-size:28px;color:#aaa}.handle{font-size:26px;font-weight:800}.project{text-align:right;letter-spacing:.15em}.rule{height:1px;background:linear-gradient(90deg,var(--l),transparent);margin:30px 0 52px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:50px}.date{font-size:70px;font-weight:800;letter-spacing:-3px}.label{margin-top:28px;color:#a7b1ac;letter-spacing:.3em;font-size:13px}.output{font-size:150px;line-height:.88;color:var(--g);font-weight:900;letter-spacing:-8px}.outtxt{font-size:34px;font-weight:900}.status{margin-top:14px;color:#b7c1bb;letter-spacing:.2em;font-size:13px}.focus{color:var(--g);font-size:25px;font-weight:800;line-height:1.3;margin-top:34px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:40px;border-top:1px solid #222;border-bottom:1px solid #222}.metric{padding:20px 24px 22px 0}.metric+.metric{border-left:1px solid #222;padding-left:24px}.k{color:var(--m);font-size:12px;text-transform:uppercase}.v{font-size:29px;font-weight:800;margin-top:8px}.green{color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:44px}.panel{border:1px solid var(--l);border-radius:18px;background:linear-gradient(180deg,rgba(7,16,12,.85),rgba(2,6,4,.72));overflow:hidden}.head{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--l);font-size:14px;font-weight:800;letter-spacing:.12em}.stats{display:grid;grid-template-columns:1fr 1fr}.stat{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #151515}.stat:nth-child(odd){border-right:1px solid #151515}.stat span:last-child{color:var(--g);font-weight:800}.wins,.tasks{padding:10px 20px}.row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #151515;font-size:13px}.tick{color:var(--g);font-weight:900}.tasksPanel{margin-top:26px}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.foot{margin-top:20px;color:#66716b;font-size:11px;display:flex;justify-content:space-between}@media(max-width:850px){.shell{padding:28px 20px}.top,.hero{display:block}.project{text-align:left;margin-top:20px}.hero{display:block}.grid,.tasks{grid-template-columns:1fr}.date{font-size:52px}.output{font-size:110px}}</style></head><body><main class="shell"><header class="top"><div class="id"><img class="logo" src="assets/shopify.webp" alt="Shopify"><span class="x">×</span><img class="avatar" src="assets/profile.webp" alt="Profile"><span class="handle" id="handle">@Siphodegier_</span></div><div class="project"><div id="project">LANGLEY</div><small id="sessionLabel">ECOM WEBSITE · SESSION RECAP</small></div></header><div class="rule"></div><section class="hero"><div><div class="date" id="date"></div><div class="label">TODAY'S OUTPUT</div><div class="output">+<span id="tasksCompleted">0</span></div><div class="outtxt">TASKS COMPLETED</div><div class="status">● <span id="status">SESSION COMPLETED</span></div></div><div><div class="label">CURRENT FOCUS</div><div class="focus" id="focus"></div><div class="metrics"><div class="metric"><div class="k">Store</div><div class="v green" id="storeStatus"></div></div><div class="metric"><div class="k">Revenue impact</div><div class="v" id="revenueImpact"></div></div><div class="metric"><div class="k">Stage</div><div class="v green" id="revenueLabel"></div></div></div></div></section><section class="grid"><article class="panel"><div class="head"><span>SESSION STATS</span><span id="taskRatio"></span></div><div class="stats"><div class="stat"><span>Research Signals</span><span id="researchSignals"></span></div><div class="stat"><span>Videos Analyzed</span><span id="videosAnalyzed"></span></div><div class="stat"><span>Interviews Reviewed</span><span id="interviewsReviewed"></span></div><div class="stat"><span>Benchmark</span><span id="benchmark"></span></div></div></article><article class="panel"><div class="head"><span>KEY WINS</span><span>LOCKED IN</span></div><div class="wins" id="wins"></div></article></section><section class="panel tasksPanel"><div class="head"><span>COMPLETED WORK</span><span>LIVE SESSION DATA</span></div><div class="tasks" id="tasks"></div></section><footer class="foot"><span id="updated"></span><span>LANGLEY OPS / SHOPIFY</span></footer></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('langley-session.json?v='+Date.now(),{cache:'no-store'});const d=await r.json();const g=id=>document.getElementById(id);['handle','project','date','status','focus','storeStatus','revenueImpact','revenueLabel','researchSignals','videosAnalyzed','interviewsReviewed','benchmark'].forEach(k=>g(k).textContent=d[k]??'');g('sessionLabel').textContent=(d.sessionLabel||'ECOM WEBSITE')+' · SESSION RECAP';g('tasksCompleted').textContent=d.tasksCompleted??0;g('taskRatio').textContent=`${d.tasksCompleted??0} / ${d.tasksTotal??0} DONE`;g('updated').textContent='LAST UPDATE · '+(d.lastUpdated||'—');g('wins').innerHTML=(d.keyWins||[]).map(x=>`<div class="row"><span class="tick">✓</span><span>${e(x)}</span></div>`).join('');g('tasks').innerHTML=(d.tasks||[]).map(x=>`<div class="row"><span class="tick">✓</span><span>${e(x)}</span></div>`).join('')}load();</script></body></html>
